<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Web Page</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th scope="col" colspan="1">Header 1</th>
          <th scope="col" colspan="1">Header 2</th>
          <th scope="col" colspan="1">rowspan Header 3</th>
        </tr>
        <tr>
          <th scope="col">Header 1.1</th>
          <th scope="col">Header 1.2</th>
          <th scope="col">Header 2.1</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td scope="row">Row 1, Cell 1</td>
          <td>Row 1, Cell 2</td>
          <td>Row 1, Cell 3</td>
        </tr>
        <tr>
          <td scope="row">Row 2, Cell 1</td>
          <td>Row 2, Cell 2</td>
          <td>Row 2, Cell 3</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td scope="row" colspan="2">Footer</td>
          <td rowspan="2">Row 2, Cell 3</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
